<text x="595" y="756" text-anchor="start" class="small">policy revenue = avoided-carbon credit + durable-removal credit + fuel/product premiums</text>
<rect x="575" y="806" width="390" height="52" rx="6" fill="#ffffff" stroke="#d6dedf" opacity="1.0"/>
<text x="595" y="838" text-anchor="start" class="small">profitability window = first year with margin &gt; 0 for at least one city-route pair</text>
