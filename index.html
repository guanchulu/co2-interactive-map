<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>China CO2 Allocation Interactive Map</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #f7faf9;
      }
      iframe {
        width: 100%;
        height: 100vh;
        border: 0;
        display: block;
      }
      .fallback {
        position: fixed;
        left: 16px;
        bottom: 12px;
        z-index: 2;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(255,255,255,0.9);
        color: #243033;
        font: 13px/1.4 Arial, sans-serif;
      }
      .fallback a {
        color: #245f6d;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <iframe src="./docs/interactive_map_public/static_site/" title="China CO2 Allocation Interactive Map"></iframe>
    <div class="fallback">
      If the map does not load, open
      <a href="./docs/interactive_map_public/static_site/">the direct map page</a>.
    </div>
  </body>
</html>
