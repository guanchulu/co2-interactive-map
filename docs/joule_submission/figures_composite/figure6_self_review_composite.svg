<rect x="210.0" y="651.8666666666667" width="420.0" height="31.166666666666668" rx="3" fill="#c97836" stroke="none" opacity="1.0"/>
<text x="204" y="674.5333333333333" text-anchor="end" class="axis">Moderate</text>
<text x="634.0" y="674.5333333333333" text-anchor="start" class="axis">6</text>
<rect x="210.0" y="708.5333333333334" width="350.0" height="31.166666666666668" rx="3" fill="#b94d5a" stroke="none" opacity="1.0"/>
