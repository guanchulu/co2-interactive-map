<text x="858" y="521" class="paneltitle">Editorial rule for revisions</text>
<rect x="860" y="565" width="610" height="34" rx="5" fill="#ffffff" stroke="#d6dedf" opacity="1.0"/>
<text x="880" y="588" text-anchor="start" class="label">Every figure must answer one decision question.</text>
