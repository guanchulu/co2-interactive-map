<text x="880" y="636" text-anchor="start" class="label">Every heat map must state the scenario and unit.</text>
<rect x="860" y="661" width="610" height="34" rx="5" fill="#ffffff" stroke="#d6dedf" opacity="1.0"/>
<text x="880" y="684" text-anchor="start" class="label">Every optimistic claim must list its enabling conditions.</text>
<rect x="860" y="709" width="610" height="34" rx="5" fill="#ffffff" stroke="#d6dedf" opacity="1.0"/>
<text x="880" y="732" text-anchor="start" class="label">Every C/D input must stay visible in SI.</text>
<rect x="860" y="757" width="610" height="34" rx="5" fill="#ffffff" stroke="#d6dedf" opacity="1.0"/>
<text x="880" y="780" text-anchor="start" class="label">No route is called profitable outside the simulated window.</text>
