<text x="564.0" y="731.2" text-anchor="start" class="axis">5</text>
<line x1="210" y1="755" x2="630" y2="755" stroke="#8b969a" stroke-width="1"/>
<text x="420.0" y="775" text-anchor="middle" class="axis">claim count</text>
